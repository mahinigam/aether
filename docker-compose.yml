include:
  - docker-compose.loadtest.yml

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: chat_postgres
    command: "postgres -c max_connections=250 -c shared_buffers=128MB"
    environment:
      POSTGRES_DB: chat_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat_network

  # ============================================
  # Redis (for Pub/Sub and caching)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: chat_redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat_network

  # ============================================
  # Elasticsearch (for industrial-scale search)
  # Optional: launch with --profile search or --profile full
  # ============================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: chat_elasticsearch
    profiles:
      - search
      - full
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - chat_network

  # ============================================
  # Backend (Node.js + Socket.io + Redis Adapter)
  # Scale with: docker compose up -d --scale backend=4
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chat_platform
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_POOL_MIN: 5
      DB_POOL_MAX: 100
      DB_CONNECTION_TIMEOUT_MS: 10000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost,http://localhost:5173
      CONNECTION_RATE_LIMIT_MAX: ${CONNECTION_RATE_LIMIT_MAX:-500}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - chat_network

  # ============================================
  # NGINX Load Balancer (for backend instances)
  # Enables horizontal scaling demonstration
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: chat_nginx
    ports:
      - "3000:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - chat_network

  # ============================================
  # Frontend (React + Vite)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - chat_network
    depends_on:
      backend:
        condition: service_healthy

  # ============================================
  # Coturn (TURN/STUN Server)
  # Optional: launch with --profile webrtc or --profile full
  # ============================================
  coturn:
    image: coturn/coturn
    container_name: chat_coturn
    profiles:
      - webrtc
      - full
    restart: always
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
    environment:
      - TURNSERVER_REALM=localhost
      - TURNSERVER_USER=user:password
    command:
      - -n
      - --log-file=stdout
      - --min-port=49152
      - --max-port=65535
    networks:
      - chat_network

volumes:
  postgres_data:
  redis_data:
  es_data:
  uploads_data:

networks:
  chat_network:
    driver: bridge
