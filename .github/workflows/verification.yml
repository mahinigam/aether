name: Verification

on:
  push:
    branches:
      - master
      - "maintenance/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Linting and TypeScript verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

  test-and-build:
    name: ${{ matrix.project }} tests and build
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        project:
          - backend
          - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Run automated tests
        working-directory: ${{ matrix.project }}
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Build production bundle
        working-directory: ${{ matrix.project }}
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-verification-results
          path: |
            ${{ matrix.project }}/test.log
            ${{ matrix.project }}/build.log
          if-no-files-found: warn
          retention-days: 90

  docker-build-verification:
    name: Docker image build verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: aether-backend:ci

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: aether-frontend:ci

  security-and-supply-chain:
    name: Security scan and supply-chain SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Check tracked asset provenance registry
        run: npm run audit:assets

      - name: Run Gitleaks secret detection
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest detect --source="/repo" --verbose

      - name: Verify dependency tree peer conflicts
        run: |
          npm ls --all > dependency-peer-review.txt 2>&1
          cat dependency-peer-review.txt

      - name: Generate root dependency SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@7.0.0 --package-lock-only --ignore-npm-errors --output-file root-sbom.cdx.json

      - name: Generate backend dependency SBOM
        working-directory: backend
        run: npx --yes @cyclonedx/cyclonedx-npm@7.0.0 --package-lock-only --ignore-npm-errors --output-file ../backend-sbom.cdx.json

      - name: Generate frontend dependency SBOM
        working-directory: frontend
        run: npx --yes @cyclonedx/cyclonedx-npm@7.0.0 --package-lock-only --ignore-npm-errors --output-file ../frontend-sbom.cdx.json

      - name: Retain supply-chain audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-supply-chain-audit
          path: |
            root-sbom.cdx.json
            backend-sbom.cdx.json
            frontend-sbom.cdx.json
            dependency-peer-review.txt
          if-no-files-found: warn
          retention-days: 90
