name: Verification

on:
  push:
    branches:
      - master
      - "maintenance/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.project }} tests and build
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        project:
          - backend
          - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Run automated tests
        working-directory: ${{ matrix.project }}
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Build production bundle
        working-directory: ${{ matrix.project }}
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-verification-results
          path: |
            ${{ matrix.project }}/test.log
            ${{ matrix.project }}/build.log
          if-no-files-found: warn
          retention-days: 90

  supply-chain-audit:
    name: Asset provenance and dependency SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      - name: Check tracked asset provenance registry
        run: npm run audit:assets

      - name: Record dependency tree peer conflicts
        run: npm ls @opentelemetry/api @opentelemetry/sdk-metrics --all > dependency-peer-review.txt 2>&1 || true

      - name: Generate root dependency SBOM
        run: npm sbom --sbom-format=spdx --package-lock-only --force --force > root-sbom.spdx.json

      - name: Generate backend dependency SBOM
        working-directory: backend
        run: npm sbom --sbom-format=spdx --package-lock-only --force > ../backend-sbom.spdx.json

      - name: Generate frontend dependency SBOM
        working-directory: frontend
        run: npm sbom --sbom-format=spdx --package-lock-only --force > ../frontend-sbom.spdx.json

      - name: Retain supply-chain audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-supply-chain-audit
          path: |
            root-sbom.spdx.json
            backend-sbom.spdx.json
            frontend-sbom.spdx.json
            dependency-peer-review.txt
          if-no-files-found: warn
          retention-days: 90
