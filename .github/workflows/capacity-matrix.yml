name: Capacity Testing Matrix

on:
  workflow_dispatch:
    inputs:
      target_connections:
        description: "Total connection target across workers (e.g. 1000, 2500)"
        required: false
        default: "1000"
  push:
    branches:
      - master
    paths:
      - "scripts/websocket-capacity-test.cjs"
      - "scripts/run-multi-capacity-test.cjs"
      - "scripts/aggregate-capacity-reports.cjs"
      - "docker-compose.loadtest.yml"
      - "Dockerfile.loadtest"
      - ".github/workflows/capacity-matrix.yml"

permissions:
  contents: read

jobs:
  distributed-capacity-benchmark:
    name: Capacity Matrix - ${{ matrix.tier.name }} (${{ matrix.tier.total_connections }} conns)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tier:
          - name: "baseline-1k"
            total_connections: 1000
            workers: 5
            ramp_seconds: 20
            hold_seconds: 20
            step_connections: 50
            step_seconds: 5
            connects_per_sec: 15
          - name: "scale-2.5k"
            total_connections: 2500
            workers: 5
            ramp_seconds: 40
            hold_seconds: 20
            step_connections: 100
            step_seconds: 5
            connects_per_sec: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Generate development TLS certificates
        run: bash scripts/generate-dev-cert.sh

      - name: Configure test environment
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" > .env
          echo "NODE_ENV=production" >> .env
          cat .env

      - name: Build and start Aether backend stack
        run: |
          docker compose up -d postgres redis backend nginx
          echo "Waiting for backend service to become healthy..."
          timeout 120 bash -c 'until docker compose ps backend --format json | grep -q "\"Health\":\"healthy\""; do sleep 2; done'
          docker compose ps

      - name: Run multi-container capacity benchmark
        env:
          TOTAL_CONNECTIONS: ${{ matrix.tier.total_connections }}
          WORKERS: ${{ matrix.tier.workers }}
          RAMP_SECONDS: ${{ matrix.tier.ramp_seconds }}
          HOLD_SECONDS: ${{ matrix.tier.hold_seconds }}
          STEP_CONNECTIONS: ${{ matrix.tier.step_connections }}
          STEP_SECONDS: ${{ matrix.tier.step_seconds }}
          CONNECTS_PER_SECOND: ${{ matrix.tier.connects_per_sec }}
        run: |
          node scripts/run-multi-capacity-test.cjs

      - name: Upload capacity benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-matrix-${{ matrix.tier.name }}
          path: |
            artifacts/high-scale-capacity-summary.json
            artifacts/capacity-worker-*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Tear down stack
        if: always()
        run: docker compose down -v
