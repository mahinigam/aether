# Chat Platform - ConfigMap and Secrets
apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-config
data:
  cors-origin: "https://chat.example.com"
  log-level: "info"
  node-env: "production"
---
# Secrets template
# DO NOT commit production secrets to Git.
# Deploy using external secret management (e.g., HashiCorp Vault, AWS Secrets Manager, SealedSecrets)
# or create manually via kubectl:
#   kubectl create secret generic chat-secrets \
#     --from-literal=database-url="postgresql://user:password@postgres:5432/chat_db" \
#     --from-literal=redis-url="redis://redis:6379" \
#     --from-literal=jwt-secret="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: chat-secrets
type: Opaque
stringData:
  database-url: "REPLACE_WITH_DATABASE_URL"
  redis-url: "REPLACE_WITH_REDIS_URL"
  jwt-secret: "REPLACE_WITH_SECURE_JWT_SECRET"
---
# PersistentVolumeClaim for uploads
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chat-uploads-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/websocket-services: "chat-api"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
    - hosts:
        - chat.example.com
        - api.chat.example.com
      secretName: chat-tls
  rules:
    - host: api.chat.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chat-api
                port:
                  number: 80
    - host: chat.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chat-frontend
                port:
                  number: 80
